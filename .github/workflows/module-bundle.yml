name: Module bundle

on:
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/module-bundle.yml"
      - "crates/openhuman-app/tauri.conf.json"
      - "crates/openhuman-core/src/modules/**"
      - "scripts/ci/self-hosted/test-module-assets.mjs"
      - "scripts/__tests__/stage-modules.test.mjs"
      - "scripts/lib/module-pins.mjs"
      - "scripts/release/stage-modules.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Check registry coverage
        run: node --test scripts/__tests__/stage-modules.test.mjs
      # Extract the ARM64 vcruntime140.dll from Microsoft's canonical
      # redistributable installer. windows-latest ships VS with the x64 build
      # tools and their redist, but NOT the ARM64 variants, and `stage-modules`
      # needs an arm64 vcruntime140.dll to ship beside each ARM64 module
      # (issue #8499 / Sentry TAURI-RUST-14J5). Earlier attempts via
      # `vs_installer modify --add VC.Tools.ARM64` and `vc_redist.arm64.exe
      # /layout` both failed on this x64 host — the modify path returned a
      # generic non-zero exit after downloading channel manifests, and /layout
      # exited with no code. The reliable path is to decompose Microsoft's
      # vc_redist installer, which is a WiX Burn bundle, with 7-Zip (shipped
      # pre-installed on windows-latest). 7z reads Burn bundles and MSIs
      # natively; we extract the DLL and point OPENHUMAN_VC_REDIST_DIR at its
      # directory, which the staging code already supports (and which the
      # arch-match check in `assertRuntimeMatchesHost` validates).
      - name: Extract ARM64 Visual C++ runtime from vc_redist (app-local staging source)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found at $sevenZip" }
          $url = 'https://aka.ms/vs/17/release/vc_redist.arm64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'vc_redist.arm64.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          # Burn-bundle unpack: 7z reads vc_redist.arm64.exe directly and
          # emits the inner MSIs/CABs beneath $burn.
          $burn = Join-Path $env:RUNNER_TEMP 'vcrt-arm64-burn'
          & $sevenZip x "-o$burn" -y $exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z expand of vc_redist.arm64.exe failed: $LASTEXITCODE" }
          # The Burn bundle lays MSIs beside its own files; each one carries
          # redist DLLs as embedded CABs. Expand every MSI and search for
          # vcruntime140.dll.
          $msiOut = Join-Path $env:RUNNER_TEMP 'vcrt-arm64-msi'
          New-Item -ItemType Directory -Force $msiOut | Out-Null
          Get-ChildItem -Recurse $burn -Filter '*.msi' | ForEach-Object {
            $target = Join-Path $msiOut ($_.BaseName)
            New-Item -ItemType Directory -Force $target | Out-Null
            & $sevenZip x "-o$target" -y $_.FullName | Out-Null
          }
          # 7z extracts MSI tables as named files; the DLL payload sits under
          # Binary.* or File.* with the real name in the MSI table — but 7z
          # exposes files by their canonical names in later versions.
          $dll = Get-ChildItem -Recurse $msiOut -Filter 'vcruntime140.dll' |
            Where-Object { $_.Length -gt 10000 } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host '--- Burn bundle contents ---'
            Get-ChildItem -Recurse $burn | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '--- MSI contents ---'
            Get-ChildItem -Recurse $msiOut | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
            throw 'vcruntime140.dll not found after extracting vc_redist.arm64.exe'
          }
          Write-Host "Extracted ARM64 vcruntime140.dll to $($dll.FullName) ($($dll.Length) bytes)"
          # OPENHUMAN_VC_REDIST_DIR expects a directory containing the DLL by
          # its unqualified name — point at the dll's own parent dir.
          "OPENHUMAN_VC_REDIST_DIR=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download and verify every bundled release
        run: node scripts/release/stage-modules.mjs --target ${{ matrix.target }}
