name: Module bundle

on:
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/module-bundle.yml"
      - "crates/openhuman-app/tauri.conf.json"
      - "crates/openhuman-core/src/modules/**"
      - "scripts/ci/self-hosted/test-module-assets.mjs"
      - "scripts/__tests__/stage-modules.test.mjs"
      - "scripts/lib/module-pins.mjs"
      - "scripts/release/stage-modules.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Check registry coverage
        run: node --test scripts/__tests__/stage-modules.test.mjs
      # The windows-latest runner image ships Visual Studio with the x64 build
      # tools and their redist, but NOT the ARM64 ones. stage-modules now ships
      # vcruntime140.dll beside each Windows module to close issue #8499 /
      # Sentry TAURI-RUST-14J5, so the ARM64 host_key needs an arm64 CRT on the
      # build host. The cleanest provisioning path is to add the ARM64 build
      # tools component to the installed VS via `vs_installer modify`; that
      # drops the arm64 CRT into VC\Redist\MSVC\<version>\arm64\, where the
      # existing `findWindowsVcRuntimeDir` + vswhere lookup finds it. Earlier
      # attempts via `vc_redist.arm64.exe /layout` failed on the x64 runner
      # (empty exit code; the installer appears to refuse a cross-arch layout
      # on this host).
      - name: Install Visual Studio ARM64 build tools (app-local VC runtime source)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $installPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $installPath) { throw 'no Visual Studio installation detected' }
          Write-Host "Modifying VS installation at $installPath"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $vsInstaller)) { throw "vs_installer.exe not found at $vsInstaller" }
          # Pin exit codes we accept: 0 (success), 862/1641/3010 (install
          # succeeded but requested a reboot — fine for file-level use).
          $allowed = @(0, 862, 1641, 3010)
          & $vsInstaller modify --quiet --norestart --wait `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64
          if ($allowed -notcontains $LASTEXITCODE) {
            throw "vs_installer modify failed: $LASTEXITCODE"
          }
          Write-Host "vs_installer modify finished (exit $LASTEXITCODE); ARM64 CRT should now be under VC\Redist\MSVC\*\arm64\"
      - name: Download and verify every bundled release
        run: node scripts/release/stage-modules.mjs --target ${{ matrix.target }}
